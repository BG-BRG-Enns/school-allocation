# The solver's packages, pinned exactly here and locked with hashes in
# uv.lock (`uv lock`); the image exports the lock to a requirements file
# at build time and installs it with pip --require-hashes (Dockerfile).
# Dependabot bumps both files together. Not a package: an environment.
[project]
name = "school-allocation-solver"
version = "0.1.0"
description = "The allocation solver: OR-Tools CP-SAT behind a small HTTP face, speaking docs/domain-and-api.md §6."
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "ortools==9.15.6755",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx2==2.16.0",
  "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
