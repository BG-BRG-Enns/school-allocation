# A drop-in for podman-auto-update.service, installed beside busy.conf under
# ~/.config/systemd/user/podman-auto-update.service.d/: the nightly update
# without its automatic rollback. A release that fails to start leaves its
# unit failing, and the app down, where someone notices, instead of the
# previous release running on unnoticed. The unit retries every two minutes
# with the newest image of the line (Pull=newer in the .container files), so
# the next release repairs it as soon as it is published; podman auto-update
# itself only looks at running containers (README.md, Updates). The first
# line clears the packaged command.
[Service]
ExecStart=
ExecStart=/usr/bin/podman auto-update --rollback=false
