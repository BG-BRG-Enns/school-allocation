# A drop-in for podman-auto-update.service, installed under
# ~/.config/systemd/user/podman-auto-update.service.d/: the nightly update
# is skipped, without failing the unit, while a job is executing (an
# allocation run, a roster import, an outbox flush), which
# deploy/not-busy.sh asks the app's health check about.
[Service]
ExecCondition=%h/school-allocation/not-busy.sh
