# Example nginx site in front of the app, with the app on a host of its
# own (PUBLIC_URL=https://wahl.example.org). nginx runs wherever TLS
# terminates: on the app's host, where the upstream is the app's
# 127.0.0.1:3000, or on another host, where it is the local end of a
# tunnel from the app's host (README.md, The proxy and TLS). Replace
# wahl.example.org, put the file into /etc/nginx/sites-available/ and
# enable it; the variant for the app under a path of an existing site is
# at the end of this file.
#
# nginx terminates TLS, forwards and logs, nothing more. Authorization and
# the security headers (CSP, HSTS, Referrer-Policy, ...) come from the app on
# every response, so add no add_header or auth directives here.

# Method and path only: no query string (sign-in returns with ?code= and
# ?state=), no cookies, no referrer, no user agent.
log_format school_allocation '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

upstream school_allocation {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name wahl.example.org;

    # Only redirects, so nothing is worth a log line here.
    access_log off;

    # Certificates from certbot certonly --webroot -w /var/www/certbot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Needs nginx 1.25.1 or newer. On an older one, remove this line and
    # write `listen 443 ssl http2;` (and the same for [::]:443) instead.
    http2 on;
    server_name wahl.example.org;

    ssl_certificate /etc/letsencrypt/live/wahl.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wahl.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/school-allocation.access.log school_allocation;
    error_log /var/log/nginx/school-allocation.error.log;

    # Request bodies are passed to the app as they arrive instead of being
    # collected first, and nothing lands in a temp file. The size matches
    # the app's 64 KiB limit; a route that takes a file (a CSV roster)
    # declares its own, larger limit, which a location below has to match.
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Set, not appended: this is the edge, so whatever X-Forwarded-For a
    # client sends is dropped. The app reads these headers only from the
    # addresses in TRUST_PROXY.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Entra returns here with the authorization code and state in the query
    # string, which an upstream error line would quote.
    location = /api/auth/callback {
        error_log /var/log/nginx/school-allocation.error.log crit;
        proxy_pass http://school_allocation;
    }

    location / {
        proxy_pass http://school_allocation;
    }
}

# Under a path of an existing site instead, PUBLIC_URL=https://www.example.org/wahl:
# the app serves everything below /wahl itself, so the path passes through
# unchanged (proxy_pass without a URI), and the locations above carry the
# same prefix, inside that site's server block, with its proxy settings.
#
#     location = /wahl/api/auth/callback {
#         error_log /var/log/nginx/school-allocation.error.log crit;
#         proxy_pass http://school_allocation;
#     }
#
#     location /wahl {
#         proxy_pass http://school_allocation;
#     }
