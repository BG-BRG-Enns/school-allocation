name: Handbook

# The handbooks (handbook/), built and published to GitHub Pages from a
# release: called by publish-image.yml once the release's images are out
# (a v<major>.<minor>.<patch> tag on main), or run by hand on such a tag
# for a handbook-only republish. So they describe what schools run, not
# main, and never a release whose images did not come out. The site
# builds from the pictures committed in handbook/public/bilder, which
# `npm run handbook:shots` renews in a pull request; no database, browser
# or journey runs here. A dead link or a missing picture fails the build,
# which then publishes nothing and leaves the previous handbook online.
# Pull requests build nothing: `npm run handbook` runs before a handbook
# change, and scripts/handbook.test.mjs, part of the tests, keeps the
# pages and pictures whole.

'on':
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build the handbook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One publication at a time; a newer tag waits for the one before (on the jobs: a called workflow has no
    # concurrency of its own at the top).
    concurrency:
      group: handbook-build
      cancel-in-progress: false
    steps:
      # Only a release tag, as the images: a run on a branch would publish
      # an unreleased handbook.
      - name: Verify release tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || ! printf '%s' "${GITHUB_REF_NAME}" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Refusing to publish: expected a v<major>.<minor>.<patch> tag, got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every branch, for the check that the tag is on main below.
          fetch-depth: 0

      # The repository-visible half of the tag ruleset (SECURITY.md,
      # Residual risks): a release is a commit of main. The ruleset lets
      # only the maintainer create a v* tag and nobody move or delete one;
      # this refuses a tag that points off main all the same, so a tag
      # alone never publishes code main never carried. The checkout above
      # fetched every branch for it (fetch-depth: 0).
      - name: Verify the tag is on main
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet origin/main >/dev/null || { echo "Refusing to publish: origin/main is not in the checkout" >&2; exit 1; }
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Refusing to publish: ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not a commit of main" >&2
            exit 1
          fi

      # No npm cache: a release builds from what the lock file names alone,
      # never from a cache another run could have filled.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      # The pages and pictures whole, as every pull request's tests check
      # them: a page missing in one language fails here, which the build
      # would not notice.
      - run: node --throw-deprecation --test scripts/handbook.test.mjs

      - run: npm run handbook

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: handbook/.vitepress/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: handbook
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
