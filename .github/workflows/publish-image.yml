name: Publish Images

# A release: a v<major>.<minor>.<patch> tag on main, pushed by hand (the
# repository's ruleset lets only the maintainer create one, and the check
# below refuses a tag off main). It publishes three images to GHCR, the app, its PostgreSQL
# (deploy/postgres/Dockerfile) and the solver (apps/solver), each under the
# release tag, an immutable sha-<commit> tag and the floating line tag
# v<major>, which the deployments follow (deploy/quadlet, deploy/README.md):
# a school's podman-auto-update pulls the new v1 the night after. A v2
# moves v2 alone. No `latest`: it would move across major lines. Each image
# is signed with the repository's cosign key, which a host's policy requires
# (deploy/policy.json), so an image that did not come through this workflow
# is refused there.
#
# The order protects the line: the builds push the sha-<commit> tag alone,
# which no host follows; the images are signed and pulled as a host pulls
# them; only then do the release tag and the line tag go onto the verified
# digests, the release tags first, the line tags last, all three images in
# one step. A failure before that leaves the line where it was. The
# handbook publishes after the images, from the same tag, so it never
# describes a release that did not come out.

'on':
  workflow_dispatch: {}
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # One release at a time, in the order the tags were pushed: two runs
    # interleaving could move the line to the older of the two. The guard
    # before the line moves (below) refuses that too.
    concurrency:
      group: publish-images
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every branch, for the check that the tag is on main below.
          fetch-depth: 0

      # Only a release tag, and only a plain one: a pre-release such as
      # v1.1.0-rc1 would move the v1 line too.
      - name: Verify release tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || ! printf '%s' "${GITHUB_REF_NAME}" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Refusing to publish: expected a v<major>.<minor>.<patch> tag, got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi

      # The repository-visible half of the tag ruleset (SECURITY.md,
      # Residual risks): a release is a commit of main. The ruleset lets
      # only the maintainer create a v* tag and nobody move or delete one;
      # this refuses a tag that points off main all the same, so a tag
      # alone never publishes code main never carried. The checkout above
      # fetched every branch for it (fetch-depth: 0).
      - name: Verify the tag is on main
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet origin/main >/dev/null || { echo "Refusing to publish: origin/main is not in the checkout" >&2; exit 1; }
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Refusing to publish: ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not a commit of main" >&2
            exit 1
          fi

      # The images live under the repository owner, lower-cased: a registry
      # name must be, an owner such as BG-BRG-Enns is not. deploy/policy.json
      # and deploy/quadlet name the same owner.
      - name: Name the images
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "APP_IMAGE=ghcr.io/${owner}/school-allocation"
            echo "POSTGRES_IMAGE=ghcr.io/${owner}/school-allocation-postgres"
            echo "SOLVER_IMAGE=ghcr.io/${owner}/school-allocation-solver"
          } >> "$GITHUB_ENV"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit runs the build and pushes with the job's package token, and
      # its built-in frontend reads the Dockerfiles, which name none of
      # their own: pinned by tag and digest like every image, so a moved
      # tag cannot change what gets signed. Dependabot does not see this
      # pin; it is bumped by hand, here and in ci.yml (npm run lint:deps
      # refuses one without a digest).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=docker.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: app
        with:
          images: ${{ env.APP_IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          # A software bill of materials as an attestation beside the image
          # and its provenance: what the image contains, from its packages,
          # for whoever runs it. Signed with the rest of the index below.
          sbom: true
          context: .
          push: true
          tags: ${{ steps.app.outputs.tags }}
          labels: ${{ steps.app.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: postgres
        with:
          images: ${{ env.POSTGRES_IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-postgres
        with:
          # A software bill of materials as an attestation beside the image
          # and its provenance: what the image contains, from its packages,
          # for whoever runs it. Signed with the rest of the index below.
          sbom: true
          context: deploy/postgres
          push: true
          tags: ${{ steps.postgres.outputs.tags }}
          labels: ${{ steps.postgres.outputs.labels }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: solver
        with:
          images: ${{ env.SOLVER_IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-solver
        with:
          # A software bill of materials as an attestation beside the image
          # and its provenance: what the image contains, from its packages,
          # for whoever runs it. Signed with the rest of the index below.
          sbom: true
          context: apps/solver
          push: true
          tags: ${{ steps.solver.outputs.tags }}
          labels: ${{ steps.solver.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}

      # The key and its password are repository secrets; deploy/cosign.pub
      # is the public half. Each tag names an index (the image for
      # linux/amd64 and its provenance), and podman checks the signature of
      # the image it takes from the index, not of the index itself, and finds
      # signatures only under cosign's classic tags (sha256-<digest>.sig),
      # not in the bundles cosign 3 stores by default. So every manifest of
      # the index is signed, in the classic format.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Before anything is pushed under the line tag: the public half must
      # be in the repository, or every host's policy refuses the images.
      - name: Verify the public key is present
        run: |
          set -euo pipefail
          if [ ! -s deploy/cosign.pub ]; then
            echo "Refusing to publish: deploy/cosign.pub is missing. Generate the key pair once (cosign generate-key-pair), commit the public key as deploy/cosign.pub and store the private key and its password as the repository secrets COSIGN_PRIVATE_KEY and COSIGN_PASSWORD (deploy/README.md, Signatures)." >&2
            exit 1
          fi

      - name: Sign the images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          APP_DIGEST: ${{ steps.build.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.build-postgres.outputs.digest }}
          SOLVER_DIGEST: ${{ steps.build-solver.outputs.digest }}
        run: |
          set -euo pipefail
          for image in "${APP_IMAGE}@${APP_DIGEST}" "${POSTGRES_IMAGE}@${POSTGRES_DIGEST}" "${SOLVER_IMAGE}@${SOLVER_DIGEST}"; do
            cosign sign --yes --recursive --new-bundle-format=false --use-signing-config=false \
              --key env://COSIGN_PRIVATE_KEY "$image"
          done

      # The check that counts is the host's, not cosign's: cosign verify
      # accepts signatures podman cannot use. So the images are pulled by
      # the podman the units are tested with, under the policy, registry
      # setting and key a host installs from deploy/, unchanged; a pull it
      # refuses fails the release before anything reaches a school.
      - name: Pull the images as a host does
        env:
          APP_DIGEST: ${{ steps.build.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.build-postgres.outputs.digest }}
          SOLVER_DIGEST: ${{ steps.build-solver.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --privileged -v "$PWD/deploy:/deploy:ro" \
            -e APP="${APP_IMAGE}@${APP_DIGEST}" -e POSTGRES="${POSTGRES_IMAGE}@${POSTGRES_DIGEST}" -e SOLVER="${SOLVER_IMAGE}@${SOLVER_DIGEST}" \
            quay.io/podman/stable:v5.4@sha256:52536d900c9e7e7cc924bb737eb8c570eeaa3c50f6a3b0b563eb0ec9c48807e4 \
            sh -euc '
              mkdir -p /home/allocation/school-allocation /etc/containers/registries.d
              cp /deploy/cosign.pub /home/allocation/school-allocation/cosign.pub
              cp /deploy/policy.json /etc/containers/policy.json
              cp /deploy/registries.d/ghcr.yaml /etc/containers/registries.d/ghcr.yaml
              for image in "$APP" "$POSTGRES" "$SOLVER"; do
                podman --storage-driver vfs pull --quiet "$image"
              done'

      # The line never goes back: the release the line's app image carries
      # now (the package's tags name it) must be older than this one, or
      # the same (a re-run); otherwise the release tags are published and
      # the line is left alone, said so in the summary.
      - name: Decide whether the line moves
        id: line
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="${GITHUB_REF_NAME}"
          line="v${GITHUB_REF_NAME#v}"
          line="${line%%.*}"
          current="$(gh api --paginate "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/school-allocation/versions?per_page=100" \
            --jq "[.[] | select(.metadata.container.tags | index(\"${line}\")) | .metadata.container.tags[] | select(test(\"^v[0-9]+[.][0-9]+[.][0-9]+$\"))] | first // empty")"
          move=yes
          if [ -n "$current" ] && [ "$current" != "$release" ] && [ "$(printf '%s\n%s\n' "$current" "$release" | sort -V | tail -n 1)" = "$current" ]; then
            move=no
            echo "The ${line} line carries ${current}, newer than ${release}: the release is published, the line stays." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "move=${move}" >> "$GITHUB_OUTPUT"
          echo "name=${line}" >> "$GITHUB_OUTPUT"

      # Only now the tags a host can see: the release tag and the line tag,
      # put on the verified digests themselves (the same index, so the
      # signatures, the SBOM and the provenance stay with it; the digest is
      # checked after each tag, and a registry hiccup is retried). The
      # release tags of all three images first, the line tags last, in one
      # step of seconds: a failure before this step leaves nothing but
      # sha-<commit>; a failure between the line tags is healed by running
      # the job again, which tags the same verified digests.
      - name: Tag the verified images
        env:
          APP_DIGEST: ${{ steps.build.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.build-postgres.outputs.digest }}
          SOLVER_DIGEST: ${{ steps.build-solver.outputs.digest }}
          MOVE_LINE: ${{ steps.line.outputs.move }}
          LINE: ${{ steps.line.outputs.name }}
        run: |
          set -euo pipefail
          release="${GITHUB_REF_NAME}"
          tag() {
            attempt=1
            until docker buildx imagetools create --tag "$1:$2" "$1@$3"; do
              if [ "$attempt" -ge 3 ]; then echo "Giving up on $1:$2 after $attempt attempts" >&2; exit 1; fi
              attempt=$((attempt + 1))
              sleep 5
            done
            actual="$(docker buildx imagetools inspect "$1:$2" --format '{{.Manifest.Digest}}')"
            if [ "$actual" != "$3" ]; then
              echo "Refusing to go on: $1:$2 is $actual, not the verified $3" >&2
              exit 1
            fi
          }
          tags="$release"
          if [ "$MOVE_LINE" = "yes" ]; then tags="$release $LINE"; fi
          for which in $tags; do
            tag "$APP_IMAGE" "$which" "$APP_DIGEST"
            tag "$POSTGRES_IMAGE" "$which" "$POSTGRES_DIGEST"
            tag "$SOLVER_IMAGE" "$which" "$SOLVER_DIGEST"
          done

      # Expansions go through env rather than straight into the script body:
      # inlining ${{ ... }} splices the value into the shell source before it
      # runs, which is how a crafted value becomes executable code.
      - name: Report the release
        env:
          APP_DIGEST: ${{ steps.build.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.build-postgres.outputs.digest }}
          SOLVER_DIGEST: ${{ steps.build-solver.outputs.digest }}
        run: |
          set -euo pipefail
          line="v${GITHUB_REF_NAME#v}"
          line="${line%%.*}"
          {
            echo "### school-allocation ${GITHUB_REF_NAME}"
            echo
            echo "Deployments follow the \`${line}\` line of the three images (deploy/README.md) and pick this release up with their next nightly update."
            echo
            echo '```'
            echo "${APP_IMAGE}:${GITHUB_REF_NAME}@${APP_DIGEST}"
            echo "${POSTGRES_IMAGE}:${GITHUB_REF_NAME}@${POSTGRES_DIGEST}"
            echo "${SOLVER_IMAGE}:${GITHUB_REF_NAME}@${SOLVER_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The handbook describes the release, so it publishes after the images
  # are out, from the same tag (handbook.yml, a reusable workflow, which
  # also runs by hand for a handbook-only republish).
  handbook:
    name: Handbook
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/handbook.yml

  # Bound registry growth. Each release adds an index per image, tagged
  # with the release, the immutable sha-<commit> and the moving line tag,
  # its entries and their signatures, which cosign stores as tagged
  # artifacts next to the image and which are newer than it, so pruning by
  # age never leaves an image without its signature. Keep enough history
  # that a host can be put back on a recent release by hand.
  cleanup-packages:
    name: Prune old versions
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: school-allocation
          package-type: container
          min-versions-to-keep: 20
          delete-only-untagged-versions: false
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: school-allocation-postgres
          package-type: container
          min-versions-to-keep: 20
          delete-only-untagged-versions: false
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: school-allocation-solver
          package-type: container
          min-versions-to-keep: 20
          delete-only-untagged-versions: false
